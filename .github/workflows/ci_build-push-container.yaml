---
name: Build and Push Container

on:
  # Should it be needed, allow manual triggering
  workflow_dispatch:
  # Allow calling from other GHA workflows.
  # See: https://docs.github.com/en/actions/sharing-automations/reusing-workflows#creating-a-reusable-workflow
  workflow_call:

# Start with no permissions, then allow per job/action
permissions: {}

jobs:
  # Ideally, the release wouldn't be allowed to proceed if tests fail.
  # We need to handle the manual workflow_dispatch case, though so it doesn't
  #    hurt to have the tests run first, again.
  lint_test_python:
    uses: $/.github/workflows/ci_python_lint_and_test.yaml
    permissions:
      # Needed for the test job to run
      contents: read

  release_package:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: lint_test_python
    ##
    # See: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        id: login-ghcr
        # See: https://github.com/docker/login-action/releases
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          # See: https://docs.github.com/en/actions/publishing-packages/publishing-docker-images#publishing-images-to-github-packages
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.description="Prometheus exporter for SB8200 cable modem stats"

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # For now, I only have amd64 nodes in k8s cluster
          platforms: linux/amd64

          # Don't build/push on PRs
          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.15
