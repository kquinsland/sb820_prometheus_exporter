---
name: Python Lint and Test

on:
    # Should it be needed, allow manual triggering
    workflow_dispatch:
    # Allow calling from other GHA workflows.
    # See: https://docs.github.com/en/actions/sharing-automations/reusing-workflows#creating-a-reusable-workflow
    workflow_call:
    # As soon as an open PR has modified Python or its build metadata, run the checks.
    # This flow will re-run the checks if new commits are added to the PR.
    pull_request:
        paths:
            - "**.py"
            - ".github/workflows/ci_python_lint_and_test.yaml"
            - "Dockerfile"
            - "pyproject.toml"
            - "uv.lock"
# Start with no permissions, then allow per job/action
permissions: {}

env:
    PYTHON_VERSION: "3.15"

jobs:
    lint-format:
        name: Lint and Format with Ruff
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout Repo
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check for lint violations
              id: check-lint-rules
              uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
              with:
                  version: "0.17.4"
                  args: check --output-format=github .

            - name: Check for formatting violations
              id: check-well-formatted
              uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
              # We explicitly do not fix here!
              # Show what would/should be changes and return non-zero if there are any.
              with:
                  version: "0.17.4"
                  args: format --check --diff .

    # Run tests alongside linting to reduce feedback time.
    test:
        name: Run Pytest
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            # This is needed to make sure that the tests can find the package.
            PYTHONPATH: .

        steps:
            - name: Checkout repository
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.6"
                  enable-cache: true
                  cache-python: true
                  ignore-nothing-to-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install the project
              id: install-dependencies
              run: uv sync --locked --python "$PYTHON_VERSION" --no-dev --group test

            - name: Run tests
              id: run-tests
              run: uv run --no-sync pytest
