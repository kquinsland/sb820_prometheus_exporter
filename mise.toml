# https://mise.jdx.dev/dev-tools/mise-lock.html#enabling-lockfiles
[settings]
# Push the MISE managed path to the front of the PATH variable
activate_aggressive = true
env_cache = true
exec_auto_install = true
github_attestations = true
lockfile = true
pin = true
slsa = true

lockfile_platforms = ["macos-arm64", "linux-x64"]


[settings.python]
uv_venv_auto = "create|source" # create .venv if missing, then activate

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[tools]
# Going to let UV manage this since pyproject.toml already drives this
uv = "0.13.8"
ruff = "0.17.3"
ty = "0.0.102"


# Kube things
kube-linter = "0.8.3"
kube-score = "1.20.0"
kubeconform = "0.8.0"
pluto = "5.24.4"

# Docs
# For NPM and markdown lint2
bun = "1.4.4"
markdownlint-cli2 = "0.24.0"

# General house keeping
prek = "0.5.9"
pinact = "5.0.2"
fnox = { version = "1.46.0", workflow = "release.yml" }
"github:gastownhall/beads" = "1.3.2"

[tasks.test]
description = "Run the Python test suite"
run = "uv run --locked --python 3.15 pytest"

[tasks.lint]
description = "Run all pre-commit checks"
run = "prek run --all-files"

[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint-cli2"
run = 'markdownlint-cli2 "**/*.md"'

[tasks.scrape]
description = "Run the exporter with modem credentials from fnox"
run = "fnox exec -- uv run --locked --python 3.15 app/main.py"

[tasks."docs:diagram"]
description = "Render the Kubernetes diagram using Docker (or Podman)"
run = '''
runtime="${CONTAINER_RUNTIME:-docker}"
if ! command -v "$runtime" >/dev/null 2>&1 && [ "$runtime" = docker ]; then
  runtime=podman
fi
set --
if [ "$runtime" = podman ]; then
  set -- --userns=keep-id
fi
"$runtime" run --rm "$@" --user "$(id -u):$(id -g)" \
  -e HOME=/tmp -v "$PWD:/work" -w /work \
  docker.io/philippemerle/kubediagrams:0.8.0 \
  kube-diagrams -o infra/k8s/deployment.png infra/k8s/deployment.yaml
'''
